{% extends "auctions/layout.html" %}

{% block title %}
    My Wins
{% endblock %}

{% block body %}
    <h1>My Wins</h1>

    <div class="list-group">
        {% for item in won_listings %}
            <a href="{% url 'listing_detail' item.listing.id %}" class="list-group-item list-group-item-action">
                {{ item.listing.title }}
                — Winning bid: ${{ item.highest_bid.amount }}
            </a>
        {% empty %}
            <div class="d-flex flex-column align-items-center justify-content-center text-center" style="min-height: 65vh;">
                <p class="fs-4 fw-light text-body-secondary mb-4">You haven't won any auctions yet.</p>
            </div>
        {% endfor %}
    </div>
{% endblock %}
