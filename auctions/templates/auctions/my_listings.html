{% extends "auctions/layout.html" %}

{% block title %}
    My Listings
{% endblock %}

{% block body %}
    <h1>My Listings</h1>

    <div class="list-group">
        {% for listing in listings %}
            <a href="{% url 'listing_detail' listing.id %}" class="list-group-item list-group-item-action">
                {{ listing.title }}
            </a>
        {% empty %}
            <div class="d-flex flex-column align-items-center justify-content-center text-center" style="min-height: 65vh;">
                <p class="fs-4 fw-light text-body-secondary mb-4">You have no listings.</p>
            </div>
        {% endfor %}
    </div>
{% endblock %}
