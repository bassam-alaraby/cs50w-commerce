{% extends "auctions/layout.html" %}

{% block title %}
    Categories
{% endblock %}

{% block body %}
    <h1>Categories</h1>

    <div class="list-group">
        {% for category in categories %}
            <a href="{% url 'category_listings' category %}" class="list-group-item list-group-item-action">
                {{ category }}
            </a>
        {% empty %}
        <div class="d-flex flex-column align-items-center justify-content-center text-center" style="min-height: 65vh;">
            <p class="fs-4 fw-light text-body-secondary mb-4">No categories available.</p>
        </div>
        {% endfor %}
    </div>
{% endblock %}
