{% extends "auctions/layout.html" %}

{% block title %}
    Watchlist
{% endblock %}

{% block body %}
    <h1>My Watchlist</h1>
    <ul>
        {% for item in watchlist_items %}
            <li>
                <a href="{% url 'listing_detail' item.id %}">{{ item.title }}</a>
                <a href="{% url 'remove_from_watchlist' item.id %}">(Remove)</a>
            </li>
        {% empty %}
            <li>Your watchlist is empty.</li>
        {% endfor %}
    </ul>
{% endblock %}
