{% extends "auctions/layout.html" %}

{% block title %}
    Watchlist
{% endblock %}

{% block body %}
    <h1>My Watchlist</h1>

    <div class="list-group">
        {% for item in watchlist_items %}
            <a href="{% url 'listing_detail' item.id %}" class="list-group-item list-group-item-action">
                {{ item.title }}
            </a>
        {% empty %}
            <div class="d-flex flex-column align-items-center justify-content-center text-center" style="min-height: 65vh;">
                <p class="fs-4 fw-light text-body-secondary mb-4">Your watchlist is empty.</p>
            </div>
        {% endfor %}
    </div>
{% endblock %}
