{% extends "auctions/layout.html" %}

{% block title %}
    {{ category }}
{% endblock %}

{% block body %}
    <h1>{{ category }}</h1>

    <ul>
        {% for listing in listings %}
            <li>
                <a href="{% url 'listing_detail' listing.id %}">
                    {{ listing.title }}
                </a>
            </li>
        {% empty %}
            <li>No active listings in this category.</li>
        {% endfor %}
    </ul>
{% endblock %}
